name: workflows lint

on:
  push:
    branches: ['**']  # excludes tag pushes
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/zizmor.yml'
      - '.github/dependabot.yml'  # zizmor audits it, see below

  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/zizmor.yml'
      - '.github/dependabot.yml'  # zizmor audits it, see below

  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'false'
          persist-credentials: false

      - name: Install actionlint
        id: actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      # workflow syntax, action inputs, matrix and runner labels; see
      # .github/actionlint.yaml.  SC2086 (unquoted expansions) is pre-existing
      # quoting style across the build scripts, not something a workflow edit
      # should be blocked on.
      - name: actionlint
        run: ${{ steps.actionlint.outputs.executable }} -color
        shell: bash
        env:
          SHELLCHECK_OPTS: -e SC2086

      # workflow security: template injection, over-broad permissions,
      # unpinned actions and images; see .github/zizmor.yml.
      #
      # the whole of .github/, not just the workflows: composite actions under
      # .github/actions/ carry run: blocks of their own, which nothing else in
      # CI audits -- actionlint does not shellcheck them -- and dependabot.yml
      # is checked too.
      #
      # medium and above for now.  The repo has no medium findings left, so
      # this gates on high; below it sit 78 low ones -- 46 self-repository, 31
      # artipacked (checkout without persist-credentials: false), 1
      # adhoc-packages -- left for a later pass.
      #
      # GH_TOKEN because zizmor is offline without one, and offline it skips
      # five audits.  Two of them are the ones that watch a tag: it is
      # known-vulnerable-actions and ref-confusion that this repo gains by
      # handing over a token.  The other three -- impostor-commit,
      # ref-version-mismatch and stale-action-refs -- only inspect hash pins,
      # which this repo does not use, so they cannot fire here either way.
      # Note that online zizmor fails the job outright if it cannot resolve a
      # referenced action.
      #
      # !cancelled() rather than nothing, so a workflow with both an actionlint
      # and a zizmor problem reports them in the same run.
      - name: zizmor
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 -m pip install zizmor==1.30.0
          # 14 is "audited, found something".  1 is "could not run", and online
          # that includes an action zizmor cannot resolve -- deleted, renamed,
          # or the API having a bad minute -- which aborts the whole audit and
          # should not fail a pull request that touched nothing related.  A
          # broken config exits 1 as well and must stay fatal, so only the
          # audit-abort message is forgiven: anything else, including a message
          # this stops recognising, still fails the job.
          rc=0
          zizmor --min-severity=medium .github/ 2>&1 | tee zizmor.log || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 14 ] && grep -q "audit failed" zizmor.log; then
            echo "::warning::zizmor could not complete (exit ${rc}); see the log above"
            rc=0
          fi
          exit "$rc"
        env:
          GH_TOKEN: ${{ github.token }}
